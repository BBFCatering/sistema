<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Accesos</title>
<style>
  :root{
    --bg: #1b1e24;
    --panel: #23272f;
    --panel-2: #2b3039;
    --line: #383e4a;
    --text: #e7e9ee;
    --muted: #9aa1ad;
    --accent: #e0a84c;
    --accent-2: #4c8de0;
    --danger: #d96b6b;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #262b34 0%, var(--bg) 55%);
    color:var(--text);
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:16px;
    padding:16px 28px;
    background:rgba(27,30,36,0.92);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  header h1{
    font-size:19px; margin:0; font-weight:600; letter-spacing:.3px;
    display:flex; align-items:center; gap:10px;
  }
  header h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;}
  .search{
    flex:1; max-width:340px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:8px 12px; color:var(--text); font-size:14px;
  }
  .search:focus{outline:none; border-color:var(--accent-2);}
  .btn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--text);
    padding:8px 14px; border-radius:8px; font-size:13.5px; cursor:pointer;
    transition:.15s;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#211a0d; font-weight:600;}
  .btn.primary:hover{filter:brightness(1.08); color:#211a0d;}
  #syncIndicator{
    font-size:.72rem; padding:4px 10px; border-radius:20px;
    background:rgba(107,116,153,.15); color:#9aa1ad;
    white-space:nowrap;
  }
  main{
    padding:26px 28px 60px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap:20px;
    max-width:1500px;
    margin:0 auto;
  }
  .category{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    display:flex; flex-direction:column;
    min-height:160px;
    transition: border-color .12s, box-shadow .12s;
  }
  .category.dragover{
    border-color:var(--accent-2);
    box-shadow:0 0 0 2px rgba(76,141,224,0.25) inset;
  }
  .cat-head{
    display:flex; align-items:center; gap:8px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
  }
  .cat-title{
    flex:1; font-weight:600; font-size:14.5px;
    background:transparent; border:none; color:var(--text);
    padding:2px 4px; border-radius:5px;
  }
  .cat-title:focus{outline:none; background:var(--panel-2);}
  .cat-handle{
    cursor:grab; color:var(--muted); font-size:14px; padding:2px 5px;
    flex-shrink:0; user-select:none; line-height:1;
  }
  .cat-handle:active{cursor:grabbing;}
  .category.dragover-cat{
    border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(224,168,76,0.25) inset;
  }
  .category.dragging-cat{opacity:.4;}
  .icon-btn{
    background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:14px; padding:4px 6px; border-radius:6px; line-height:1;
  }
  .icon-btn:hover{color:var(--danger); background:var(--panel-2);}
  .links{
    flex:1;
    padding:10px 10px 4px;
    display:flex; flex-direction:column; gap:6px;
    min-height:52px;
  }
  .links:empty::after{
    content:"Arrastrá un link aquí";
    color:var(--muted); font-size:12.5px; font-style:italic;
    display:block; text-align:center; padding:14px 4px;
  }
  .link-tile{
    display:flex; align-items:center; gap:9px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:7px;
    padding:7px 9px;
    cursor:grab;
    text-decoration:none;
    color:var(--text);
    font-size:13.3px;
    user-select:none;
    transition: transform .08s, border-color .12s;
  }
  .link-tile:hover{border-color:var(--accent-2);}
  .link-tile.dragging{opacity:.35;}
  .link-tile img{width:16px; height:16px; border-radius:3px; flex-shrink:0;}
  .link-tile .name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .link-item{display:flex; flex-direction:column; gap:4px;}
  .note-btn{
    background:#15171b; border:1px solid var(--line); color:#6b7280;
    font-size:11px; font-weight:700; width:18px; height:18px; line-height:1;
    border-radius:5px; flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .note-btn:hover{border-color:var(--accent-2); color:var(--accent-2);}
  .note-btn.has-note{
    background:var(--accent); border-color:var(--accent); color:#211a0d;
  }
  .note-bar{
    display:none; align-items:center; gap:6px;
    background:var(--panel-2); border:1px solid var(--accent-2);
    border-radius:7px; padding:5px 6px 5px 9px;
  }
  .note-bar input{
    flex:1; min-width:0; background:transparent; border:none; color:var(--text);
    font-size:12.6px; padding:5px 2px;
  }
  .note-bar input:focus{outline:none;}
  .note-bar .note-del{
    background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:12.5px; padding:3px 7px; border-radius:5px; flex-shrink:0;
  }
  .note-bar .note-del:hover{color:var(--danger); background:rgba(217,107,107,.12);}
  .note-bar .note-confirm{
    background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:13.5px; padding:3px 7px; border-radius:5px; flex-shrink:0;
  }
  .note-bar .note-confirm:hover{color:#00e5a0; background:rgba(0,229,160,.12);}
  .add-link{
    display:flex; gap:6px; padding:10px;
  }
  .add-link input{
    flex:1; min-width:0;
    background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-size:12.5px; padding:6px 8px;
  }
  .add-link input:focus{outline:none; border-color:var(--accent-2);}
  .add-link button{
    background:var(--accent); border:none; color:#211a0d; font-weight:700;
    border-radius:6px; width:30px; cursor:pointer; font-size:15px;
  }
  .add-category{
    display:flex; align-items:center; justify-content:center;
    border:1.5px dashed var(--line); border-radius:var(--radius);
    min-height:160px; cursor:pointer; color:var(--muted);
    font-size:14px; gap:8px; background:transparent;
    transition:.12s;
  }
  .add-category:hover{border-color:var(--accent); color:var(--accent);}
  .empty-state{
    grid-column:1/-1; text-align:center; color:var(--muted); padding:60px 20px;
    font-size:14px;
  }
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span>Mis Accesos</h1>
  <input class="search" id="search" placeholder="Buscar link o categoría...">
  <button class="btn primary" id="addCatBtn">+ Categoría</button>
  <span id="syncIndicator">🔄 Conectando...</span>
</header>

<main id="board"></main>

<script>
/* ─────────────────────────────────────────────────────────────
   Mis Accesos — versión standalone en la nube (index_david.html)
   Independiente del sistema BBF Gestión: usa el mismo proyecto
   Supabase pero una fila propia (id="links_david") en la tabla
   "stockbbf". Nada de lo que ocurre acá toca las filas "main"
   ni "produccion".
   ───────────────────────────────────────────────────────────── */

const SB_URL = 'https://aeucfekavdptmbccoftu.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFldWNmZWthdmRwdG1iY2NvZnR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMDY1NDksImV4cCI6MjA5NjY4MjU0OX0.s7KWmO1RXzNWrJj70tp_UdGYs17BRlxndqQ1b727iAc';
const SB_HEADERS = { 'Content-Type':'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };
const ROW_ID = 'links_david';

let data = { categories: [] };
let dragState = null;    // arrastre de un link individual
let cargaCompleta = false; // true recién después de leer la fila de Supabase

function uid(){ return 'x' + Math.random().toString(36).slice(2,10); }

function faviconUrl(url){
  try{
    const u = new URL(url);
    return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=32`;
  }catch(e){ return ''; }
}

function normalizeUrl(url){
  url = url.trim();
  if(!url) return '';
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  return url;
}

function setSyncStatus(estado){
  const el = document.getElementById('syncIndicator');
  if(!el) return;
  const estados = {
    ok:        { text:'☁ Sincronizado',  style:'background:rgba(0,229,160,.12);color:#00e5a0' },
    saving:    { text:'🔄 Guardando...',  style:'background:rgba(255,184,48,.1);color:#ffb830' },
    loading:   { text:'🔄 Cargando...',   style:'background:rgba(255,184,48,.1);color:#ffb830' },
    error:     { text:'❌ Sin conexión',  style:'background:rgba(255,77,106,.1);color:#ff4d6a' },
    connecting:{ text:'🔄 Conectando...', style:'background:rgba(107,116,153,.15);color:#6b7499' }
  };
  const e = estados[estado] || estados.connecting;
  el.textContent = e.text;
  el.style.cssText = `font-size:.72rem;padding:4px 10px;border-radius:20px;${e.style}`;
}

async function cargarDesdeSupabase(){
  setSyncStatus('loading');
  try{
    const res = await fetch(`${SB_URL}/rest/v1/stockbbf?id=eq.${ROW_ID}&select=data`, { headers: SB_HEADERS });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();

    if(!rows || rows.length === 0){
      // Primera vez: la fila no existe todavía, la creamos vacía.
      const ins = await fetch(`${SB_URL}/rest/v1/stockbbf`, {
        method: 'POST',
        headers: { ...SB_HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ id: ROW_ID, data: data, updated_at: new Date().toISOString() })
      });
      if(!ins.ok) throw new Error('HTTP ' + ins.status + ' al crear fila ' + ROW_ID);
    } else if(rows[0].data && Object.keys(rows[0].data).length > 0){
      // La nube es la fuente de verdad.
      data = rows[0].data;
      if(!Array.isArray(data.categories)) data.categories = [];
    }
    cargaCompleta = true;
    setSyncStatus('ok');
    render();
  }catch(e){
    console.warn('Supabase load error:', e);
    setSyncStatus('error');
  }
}

async function guardarEnSupabase(){
  if(!cargaCompleta) return; // evita pisar la nube antes de terminar de leerla
  setSyncStatus('saving');
  try{
    const res = await fetch(`${SB_URL}/rest/v1/stockbbf?id=eq.${ROW_ID}`, {
      method: 'PATCH',
      headers: { ...SB_HEADERS, 'Prefer': 'return=representation' },
      body: JSON.stringify({ data: data, updated_at: new Date().toISOString() })
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const updated = await res.json();
    if(!updated || updated.length === 0){
      const ins = await fetch(`${SB_URL}/rest/v1/stockbbf`, {
        method: 'POST',
        headers: { ...SB_HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ id: ROW_ID, data: data, updated_at: new Date().toISOString() })
      });
      if(!ins.ok) throw new Error('HTTP ' + ins.status + ' al recrear fila ' + ROW_ID);
    }
    setSyncStatus('ok');
  }catch(e){
    console.warn('Supabase save error:', e);
    setSyncStatus('error');
  }
}

function save(){ guardarEnSupabase(); }

function addCategory(name){
  data.categories.push({ id: uid(), name: name || 'Nueva categoría', links: [] });
  save(); render();
}

function removeCategory(catId){
  if(!confirm('¿Eliminar esta categoría y todos sus links?')) return;
  data.categories = data.categories.filter(c => c.id !== catId);
  save(); render();
}

function renameCategory(catId, name){
  const c = data.categories.find(c => c.id === catId);
  if(c) c.name = name;
  save();
}

function addLink(catId, url, name){
  url = normalizeUrl(url);
  if(!url) return;
  const cat = data.categories.find(c => c.id === catId);
  if(!cat) return;
  let label = name && name.trim();
  if(!label){
    try{ label = new URL(url).hostname.replace(/^www\./,''); }
    catch(e){ label = url; }
  }
  cat.links.push({ id: uid(), url, name: label });
  save(); render();
}

function removeLink(catId, linkId){
  const cat = data.categories.find(c => c.id === catId);
  if(!cat) return;
  cat.links = cat.links.filter(l => l.id !== linkId);
  save(); render();
}

function moveCategory(fromCatId, toCatId){
  const fromIdx = data.categories.findIndex(c => c.id === fromCatId);
  const toIdx = data.categories.findIndex(c => c.id === toCatId);
  if(fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
  const [moved] = data.categories.splice(fromIdx, 1);
  data.categories.splice(toIdx, 0, moved);
  save(); render();
}

// Arrastre manual de categorías (mouse), más confiable entre navegadores
// que el Drag & Drop nativo de HTML5 cuando el handle es chico.
function iniciarArrastreCategoria(catId, catEl){
  catEl.classList.add('dragging-cat');
  document.body.style.userSelect = 'none';

  function onMove(ev){
    document.querySelectorAll('.category.dragover-cat').forEach(el => el.classList.remove('dragover-cat'));
    const elUnder = document.elementFromPoint(ev.clientX, ev.clientY);
    const targetCat = elUnder && elUnder.closest('.category');
    if(targetCat && targetCat.dataset.catId !== catId){
      targetCat.classList.add('dragover-cat');
    }
  }

  function onUp(ev){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.style.userSelect = '';
    document.querySelectorAll('.category').forEach(el => el.classList.remove('dragover-cat', 'dragging-cat'));

    const elUnder = document.elementFromPoint(ev.clientX, ev.clientY);
    const targetCat = elUnder && elUnder.closest('.category');
    if(targetCat && targetCat.dataset.catId && targetCat.dataset.catId !== catId){
      moveCategory(catId, targetCat.dataset.catId);
    }
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function setNoteLocal(catId, linkId, texto){
  const cat = data.categories.find(c => c.id === catId);
  if(!cat) return;
  const link = cat.links.find(l => l.id === linkId);
  if(!link) return;
  link.nota = texto;
  save();
}

function moveLink(fromCatId, linkId, toCatId, targetIndex){
  const fromCat = data.categories.find(c => c.id === fromCatId);
  const toCat = data.categories.find(c => c.id === toCatId);
  if(!fromCat || !toCat) return;
  const idx = fromCat.links.findIndex(l => l.id === linkId);
  if(idx === -1) return;
  const [link] = fromCat.links.splice(idx, 1);
  if(targetIndex == null || targetIndex > toCat.links.length) targetIndex = toCat.links.length;
  toCat.links.splice(targetIndex, 0, link);
  save(); render();
}

function render(){
  const board = document.getElementById('board');
  const filter = (document.getElementById('search').value || '').toLowerCase();
  board.innerHTML = '';

  const filteredCats = data.categories.map(cat => {
    const catMatch = cat.name.toLowerCase().includes(filter);
    const links = catMatch ? cat.links : cat.links.filter(l =>
      l.name.toLowerCase().includes(filter) || l.url.toLowerCase().includes(filter)
    );
    return { cat, links, show: catMatch || links.length > 0 || filter === '' };
  });

  if(data.categories.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'Todavía no hay categorías. Creá una para empezar a guardar tus links.';
    board.appendChild(empty);
  }

  filteredCats.forEach(({cat, links, show}) => {
    if(!show) return;
    const catEl = document.createElement('div');
    catEl.className = 'category';
    catEl.dataset.catId = cat.id;

    const head = document.createElement('div');
    head.className = 'cat-head';

    const handle = document.createElement('span');
    handle.className = 'cat-handle';
    handle.textContent = '⠿';
    handle.title = 'Arrastrar para reordenar categoría';
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      iniciarArrastreCategoria(cat.id, catEl);
    });

    const title = document.createElement('input');
    title.className = 'cat-title';
    title.value = cat.name;
    title.addEventListener('change', () => renameCategory(cat.id, title.value));

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn';
    delBtn.textContent = '✕';
    delBtn.title = 'Eliminar categoría';
    delBtn.addEventListener('click', () => removeCategory(cat.id));

    head.appendChild(handle);
    head.appendChild(title);
    head.appendChild(delBtn);

    const linksEl = document.createElement('div');
    linksEl.className = 'links';

    (filter ? links : cat.links).forEach(link => {
      const item = document.createElement('div');
      item.className = 'link-item';

      const tile = document.createElement('a');
      tile.className = 'link-tile';
      tile.href = link.url;
      tile.target = '_blank';
      tile.rel = 'noopener noreferrer';
      tile.draggable = true;
      tile.dataset.linkId = link.id;

      const img = document.createElement('img');
      img.src = faviconUrl(link.url);
      img.alt = '';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = link.name;

      const noteBtn = document.createElement('button');
      noteBtn.className = 'note-btn' + (link.nota && link.nota.trim() ? ' has-note' : '');
      noteBtn.textContent = '+';
      noteBtn.title = 'Nota / ayudamemoria';

      tile.appendChild(img);
      tile.appendChild(name);
      tile.appendChild(noteBtn);

      // Barra expandible con la nota / ayudamemoria del sitio.
      const noteBar = document.createElement('div');
      noteBar.className = 'note-bar';

      const noteInput = document.createElement('input');
      noteInput.placeholder = 'Nota / ayudamemoria para acceder al sitio...';
      noteInput.value = link.nota || '';

      const noteConfirm = document.createElement('button');
      noteConfirm.className = 'note-confirm';
      noteConfirm.textContent = '✓';
      noteConfirm.title = 'Guardar y cerrar nota';

      const noteDel = document.createElement('button');
      noteDel.className = 'note-del';
      noteDel.textContent = '✕';
      noteDel.title = 'Eliminar sitio y nota';
      noteDel.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        if(!confirm(`¿Eliminar "${link.name}" y su nota?`)) return;
        removeLink(cat.id, link.id);
      });

      function cerrarYGuardarNota(){
        const val = noteInput.value;
        link.nota = val;
        setNoteLocal(cat.id, link.id, val);
        noteBtn.classList.toggle('has-note', !!(val && val.trim()));
        noteBar.style.display = 'none';
      }
      noteConfirm.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        cerrarYGuardarNota();
      });
      noteInput.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); cerrarYGuardarNota(); }
      });
      noteInput.addEventListener('blur', cerrarYGuardarNota);
      noteInput.addEventListener('click', e => e.stopPropagation());

      noteBtn.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        const abierta = noteBar.style.display === 'flex';
        noteBar.style.display = abierta ? 'none' : 'flex';
        if(!abierta) noteInput.focus();
      });

      noteBar.appendChild(noteInput);
      noteBar.appendChild(noteConfirm);
      noteBar.appendChild(noteDel);

      tile.addEventListener('dragstart', (e) => {
        dragState = { catId: cat.id, linkId: link.id };
        tile.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      tile.addEventListener('dragend', () => {
        tile.classList.remove('dragging');
        dragState = null;
      });

      item.appendChild(tile);
      item.appendChild(noteBar);
      linksEl.appendChild(item);
    });

    linksEl.addEventListener('dragover', (e) => {
      if(!dragState) return;
      e.preventDefault();
      catEl.classList.add('dragover');
    });
    linksEl.addEventListener('dragleave', () => {
      catEl.classList.remove('dragover');
    });
    linksEl.addEventListener('drop', (e) => {
      if(!dragState) return;
      e.preventDefault();
      catEl.classList.remove('dragover');
      const tiles = [...linksEl.querySelectorAll('.link-tile')];
      let targetIndex = tiles.length;
      for(let i=0;i<tiles.length;i++){
        const r = tiles[i].getBoundingClientRect();
        if(e.clientY < r.top + r.height/2){ targetIndex = i; break; }
      }
      moveLink(dragState.catId, dragState.linkId, cat.id, targetIndex);
    });

    const addRow = document.createElement('div');
    addRow.className = 'add-link';
    const urlInput = document.createElement('input');
    urlInput.placeholder = 'Pegar URL...';
    const nameInput = document.createElement('input');
    nameInput.placeholder = 'Nombre (opcional)';
    nameInput.style.maxWidth = '110px';
    const addBtn = document.createElement('button');
    addBtn.textContent = '+';
    addBtn.title = 'Agregar link';

    function submit(){
      if(!urlInput.value.trim()) return;
      addLink(cat.id, urlInput.value, nameInput.value);
    }
    addBtn.addEventListener('click', submit);
    urlInput.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
    nameInput.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });

    addRow.appendChild(urlInput);
    addRow.appendChild(nameInput);
    addRow.appendChild(addBtn);

    catEl.appendChild(head);
    catEl.appendChild(linksEl);
    catEl.appendChild(addRow);
    board.appendChild(catEl);
  });

  const addCatCard = document.createElement('div');
  addCatCard.className = 'add-category';
  addCatCard.innerHTML = '<span>+</span><span>Nueva categoría</span>';
  addCatCard.addEventListener('click', () => {
    const name = prompt('Nombre de la categoría:');
    if(name && name.trim()) addCategory(name.trim());
  });
  board.appendChild(addCatCard);
}

document.getElementById('addCatBtn').addEventListener('click', () => {
  const name = prompt('Nombre de la categoría:');
  if(name && name.trim()) addCategory(name.trim());
});
document.getElementById('search').addEventListener('input', render);

cargarDesdeSupabase();
</script>
